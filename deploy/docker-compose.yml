services:
  postgres:
    image: postgres:16-alpine
    container_name: mdm-postgres
    environment:
      POSTGRES_USER: mdm
      POSTGRES_PASSWORD: mdm
      POSTGRES_DB: mdm
    command: >-
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
    ports:
      # Host port 6431 -> container's default Postgres port 5432
      - "127.0.0.1:6431:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdm -d mdm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mdmnet]



volumes:
  db-data: {}

networks:
  mdmnet: {}


